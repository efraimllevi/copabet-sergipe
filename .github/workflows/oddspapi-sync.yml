name: Atualizar jogos OddsPapi COPABET

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/oddspapi_import.py'
      - 'tests/test_oddspapi.py'
      - '.github/workflows/oddspapi-sync.yml'
  pull_request:
    paths:
      - 'scripts/oddspapi_import.py'
      - 'tests/test_oddspapi.py'
      - '.github/workflows/oddspapi-sync.yml'
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests firebase-admin
      - run: python -m py_compile scripts/oddspapi_import.py
      - run: python -m unittest discover -s tests -p 'test_oddspapi.py' -v
  import:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests firebase-admin
      - name: Compilar importador Python
        run: python -m py_compile scripts/oddspapi_import.py
      - name: Sincronizar OddsPapi para Firestore
        env:
          ODDSPAPI_API_KEY: ${{ secrets.ODDSPAPI_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          ODDSPAPI_BOOKMAKER: pinnacle
        run: python scripts/oddspapi_import.py
