name: Build COPABET app icons
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/build-copabet-icons.yml'
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow
      - name: Generate PNG icons from existing COPABET logo
        run: |
          python - <<'PY'
          import base64, io, re
          from pathlib import Path
          from PIL import Image
          html=Path("index.html").read_text(encoding="utf-8")
          match=re.search(r'<img id="siteLogo" src="data:image/png;base64,([^"]+)"', html)
          if not match:
              raise RuntimeError("Original COPABET logo missing")
          original=Image.open(io.BytesIO(base64.b64decode(match.group(1)))).convert("RGBA")
          for size in (180, 192, 512):
              canvas=Image.new("RGBA",(size,size),"#061b4b")
              logo=original.copy()
              logo.thumbnail((round(size*.88),round(size*.80)),Image.Resampling.LANCZOS)
              canvas.alpha_composite(logo,((size-logo.width)//2,(size-logo.height)//2))
              Path("assets").mkdir(exist_ok=True)
              canvas.convert("RGB").save(f"assets/copabet-icon-{size}.png",format="PNG",optimize=True)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/copabet-icon-180.png assets/copabet-icon-192.png assets/copabet-icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "Generate native PNG app icons from COPABET logo"
            git push
          fi
