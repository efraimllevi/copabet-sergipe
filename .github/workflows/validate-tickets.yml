name: Validar bilhetes e comissoes
on:
  push:
    branches:
      - feat/daily-tickets-and-cancellations-20261120
  pull_request:
    branches:
      - main
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe da funcao Netlify
        run: node --check netlify/functions/cancelar-bilhete.js
      - name: Validar sintaxe dos modulos
        run: |
          node --check assets/copabet-daily-tickets.mjs
          node --check assets/cb-ticket-metrics.mjs
          node --check assets/cambista-commission.mjs
          node --check assets/copabet-modern-ui.js
      - name: Rodar testes
        run: node --test tests/cambista-commission.test.mjs tests/cb-ticket-metrics.test.mjs
